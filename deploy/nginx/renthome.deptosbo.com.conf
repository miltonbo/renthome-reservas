# Dedicated public storefront on the same upstream as DeptosBO.
# Certificate renewal uses the webroot below. Create it before enabling this file.
server {
    listen 80;
    listen [::]:80;
    server_name renthome.deptosbo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/renthome-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://renthome.deptosbo.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name renthome.deptosbo.com;

    ssl_certificate /etc/letsencrypt/live/renthome.deptosbo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/renthome.deptosbo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = / {
        rewrite ^ /renthome break;
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ "^/(?:renthome(?:/\d+|/reservar|/confirmacion)?/?|api/renthome/?|api/renthome/availability/\d+|api/renthome/photos/\d+/[a-f0-9]{32}\.webp|_next/static/.+|_next/image|brand/renthome-mark\.png|brand/renthome-reservation-logo\.jpg|marketing/short-stay-rooftop-pool\.webp|favicon\.ico)$" {
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        return 404;
    }
}
